name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC: GitHub proves its identity to AWS, no stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: portfolio-weather

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654822778682:role/github-portfolio-deploy
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v2

      - name: Deploy backend (Lambda + EventBridge)
        run: |
          sam build
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides SiteBucketName=${{ vars.S3_BUCKET }}

      - name: Publish first forecast right away
        run: |
          FN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out /tmp/out.json
          cat /tmp/out.json

      - name: Sync site to S3
        # data/* is written by the Lambda, so keep sync from uploading or deleting it.
        run: aws s3 sync site "s3://${{ vars.S3_BUCKET }}" --delete --exclude "data/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
